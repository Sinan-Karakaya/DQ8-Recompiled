# DQ8Recomp symbol database — symbolic name -> per-version address indirection.
# Reverse-engineering metadata: addresses, identified names, and source basenames
# recovered from retail assert/debug strings. This contains no game or SDK
# source code or executable instruction data.
#
# Purpose: all runtime/patch/hook code refers to game locations by NAME; this
# file maps each name to a concrete address per game version, so the same
# source supports SLES_539.74 (PAL, recon) and SLUS_212.07 (NTSC-U, target)
# without edits. Workstream 2 (Ghidra) is the main producer of entries.
#
# Schema — one [[symbol]] table per entry:
#   name           unique symbolic name (C-identifier style; :: allowed for
#                  original C++ names recovered from strings)
#   kind           one of:
#                    function     code entry point
#                    data         data object
#                    region       address range; addr is the start, and a
#                                 sibling entry "<name>_end" or an inline
#                                 `size` field bounds it
#                    source_file  original source basename recovered from
#                                 assert/debug strings (no address; anchors
#                                 for naming functions during RE)
#                    class        original class/method name recovered from
#                                 strings (address = vtable or method start
#                                 once known)
#   "SLES_539.74"  address in the PAL ELF as a "0x"-prefixed hex string,
#                  or "" when not yet located in that version
#   "SLUS_212.07"  same for the NTSC-U ELF ("" until the US dump is mapped)
#   note           free-form context (optional)
#
# Conventions:
# - Addresses are virtual addresses as seen by the game (untranslated).
# - Overlay-resident symbols also carry `overlay = "<name>"` (e.g. "battle.bin");
#   their addresses are only valid while that overlay is resident in the arena.
# - Never delete an entry that shipped in a release; rename via `note`.

# --------------------------------------------------------------------------
# Verified anchors (workstream 6 seed, 2026-08-17; derived from the PAL ELF
# header, PT_LOAD table, MWo3 overlay headers, and embedded strings)
# --------------------------------------------------------------------------

[[symbol]]
name = "_start"
kind = "function"
"SLES_539.74" = "0x00100008"
"SLUS_212.07" = ""
note = "ELF entry point (e_entry)"

[[symbol]]
name = "main_load_base"
kind = "region"
"SLES_539.74" = "0x00100000"
"SLUS_212.07" = ""
size = 0x35EC80
note = "first PT_LOAD of the main ELF (filesz 0x2E0280, memsz 0x35EC80)"

[[symbol]]
name = "overlay_arena"
kind = "region"
"SLES_539.74" = "0x0045EC80"
"SLUS_212.07" = ""
size = 0x28000
note = "MWo3 overlay arena start; one overlay resident at a time; size = largest overlay memsz (battle.bin)"

[[symbol]]
name = "overlay_arena_end"
kind = "region"
"SLES_539.74" = "0x00486C80"
"SLUS_212.07" = ""
note = "one past the overlay arena (start of the empty trailing PT_LOAD)"

[[symbol]]
name = "overlay_text_base"
kind = "region"
"SLES_539.74" = "0x0045ECC0"
"SLUS_212.07" = ""
note = "overlay .text start = arena + 0x40 MWo3 header; identical for every overlay"

