# NTSC-U resident executable. Run setup.py recompile to resolve local paths.

[general]
# Boot executable from the user's extracted disc (never committed).
input = "../Extracted_Usa/SLUS_212.07"

# Function boundaries and SDK names maintained by the analysis tools.
ghidra_output = "config/SLUS_212.07/functions.enriched.csv"

# Generated C++ lands in gitignored build/.
output = "build/generated/SLUS_212.07"

# Per-function files (upstream default) — one .cpp per function is far
# better for triage (size outliers, per-function compile smoke tests).
single_file_output = false
low_memory_mode = false
# 0 = auto
output_worker_threads = 0

# Upstream source defaults: syscalls handled by runtime, COP0/cache patched.
patch_syscalls = false
patch_cop0 = true
patch_cache = true

# SDK calls implemented by the runtime. Keep syscall wrappers, private SDK
# internals, and the complete guest allocator translated; their ABIs and state
# ownership differ from public SDK entry points.
